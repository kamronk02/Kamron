services:
  - type: web
    name: kino-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DB_PATH
        value: /var/data/kino_bot.db
      - key: PYTHON_VERSION
        value: 3.12.6
    # Eslatma: Render persistent disk odatda pullik tariflarda mavjud.
    # Disk qo'shsangiz, mountPath ni /var/data qilib belgilang.
